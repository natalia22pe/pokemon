{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pokédex SENA CIDE{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pokeapp/style.css' %}">
</head>
<body class="bg-dark text-white min-vh-100 d-flex flex-column">

    <!-- Header / Barra de Navegación -->
    <header class="py-3 px-4 shadow-sm border-bottom border-secondary border-opacity-25" style="background-color: rgba(19, 3, 59, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- Marca / Logo -->
            <a href="{% url 'index' %}" class="text-decoration-none d-flex align-items-center gap-2">
                <span class="fs-4">⚡</span>
                <span class="fw-bold fs-4 text-white">Pokémon</span>
            </a>

             <!-- Reproductor de YouTube integrado en formato cápsula -->
<!-- Reproductor de YouTube interactivo en formato cápsula -->
                    <div class="d-flex align-items-center gap-2 bg-dark bg-opacity-50 px-3 py-1 rounded-pill border border-secondary border-opacity-25">
                        <span class="small text-white-50 fw-semibold">🎵 Centro Pokémon</span>
                        <a href="https://www.youtube.com/watch?v=Rsv2VkoIpk0" target="_blank" class="btn btn-sm btn-outline-danger rounded-pill px-2 py-0 fw-bold" style="font-size: 11px; text-decoration: none; background-color: #ff0000; color: white; border: none;">
                            ▶ Reproducir
                        </a>
                    </div>                {% if user.is_authenticated %}
                                        <span class="small text-white-50 me-2">Hola, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'agregar_pokemon' %}" class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" style="background-color: #b93f23;">
                        ➕ Registrar
                    </a>
                    <form action="{% url 'logout' %}" method="POST" class="d-inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-semibold">
                            Salir
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-semibold">
                        🔑 Admin Login
                    </a>
                {% endif %}
            </div>

        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-white-50 border-top border-secondary border-opacity-25 mt-auto" style="background-color: #13033b;">
        <small>© Control de Gestión de Pokémon</small>
    </footer>

    <!-- Reproductor de YouTube oculto y script de control -->
   
<div style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none;">
    <iframe id="youtube-player" 
            src="https://www.youtube.com/embed/Rsv2VkoIpk0?enablejsapi=1&loop=1&playlist=Rsv2VkoIpk0&origin=http://127.0.0.1:8000" 
            allow="autoplay">
    </iframe>
</div>

<script>
    let isPlaying = false;
    function toggleAudio() {
        const iframe = document.getElementById('youtube-player');
        const btn = document.getElementById('btn-play-youtube');
        
        if (!isPlaying) {
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            btn.innerHTML = '⏸';
            isPlaying = true;
        } else {
            iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            btn.innerHTML = '▶';
            isPlaying = false;
        }
    }
</script>
